name: CI

# Trigger model.
#
# The previous configuration triggered only on `main`, but v0.3.x is the working branch and was 58
# commits ahead of main with none of them ever running CI.
#
# A commit is validated exactly twice, and each run answers a different question:
#
#   pull_request -> is the change under review sound?
#   push to main -> is the merge result sound? This is what actually deploys.
#
# `v*` is deliberately absent from both branch filters. Every open and merged PR (#46-#51) targets
# `main`, so `v*` under `pull_request` matched nothing. And a force-push to `v0.3.x` fires the
# `synchronize` event on the open PR, so the working branch stays covered without a `push` trigger.
#
# Release tags deliberately do NOT trigger a run either. A tag points at a commit its pull request
# has already validated and that the merge to main validates again, so a tag run re-tests an
# identical SHA and adds no signal. Worse, because the tag is pushed while the pull request is still
# open, both events land on the same commit and GitHub renders the checks twice on the pull request,
# which trains a reader to ignore the checks panel. To confirm a release commit on demand, run this
# workflow manually with workflow_dispatch.
#
# The accepted trade-off: pushing a tag at a commit that was never validated runs nothing. The gate
# for that is the pull request's required check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs are cancelled rather than left to consume runners. This matters most for the
# amend-then-force-push loop, where each push would otherwise leave a stale run behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://verse:verse@localhost:5432/verse?sslmode=disable

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verse
          POSTGRES_PASSWORD: verse
          POSTGRES_DB: verse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U verse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Floating patch within the minor line, deliberately NOT go-version-file: go.mod.
          #
          # The `go` directive in go.mod is a language and minimum-toolchain requirement, not a
          # toolchain pin. Reading it as a pin froze CI on go1.26.0 while local development ran
          # go1.26.8, and govulncheck then reported eighteen standard-library vulnerabilities in CI
          # that were already fixed in go1.26.6. The Dockerfile has always floated
          # (golang:1.26-alpine); CI now matches it. A guard below keeps the declared minor in
          # step with go.mod.
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than `latest`, and identical to the tag in the Dockerfile, so the two
          # build paths cannot silently diverge. Bumping this is a deliberate commit.
          bun-version: '1.4.2'

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Verify vendored asset integrity
        run: |
          # static/js/VENDOR.sha256 records a SHA-256 per vendored file, in the standard sha256sum
          # format. A tampered or unreviewed vendored script would otherwise be indistinguishable
          # from an intentional upgrade. The prose record of what each file is, and why it is
          # vendored, lives in static/js/VENDOR.md.
          cd static/js && sha256sum -c VENDOR.sha256

      - name: Verify committed templ artifacts are current
        run: |
          # templ artifacts are committed so `go build` works without a templ toolchain. That makes
          # stale generated code the failure mode: edit a .templ file, run a test that reads the
          # stale _templ.go, and ship the old markup with a passing build. This step converts that
          # from silent drift into a build failure. The generator is pinned to the go.mod version.
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
          if ! git diff --exit-code --stat -- templ/; then
            echo "::error::generated templ artifacts are stale. Run 'templ generate' and commit the result."
            git diff --stat -- templ/
            exit 1
          fi
          echo "templ artifacts match their sources"

      - name: Build Tailwind CSS
        run: bunx @tailwindcss/cli -i ./static/css/input.css -o ./static/css/output.css --minify

      - name: Verify CI Go version matches go.mod
        run: |
          # CI deliberately floats the Go patch release, so it is the minor that must agree with
          # go.mod. Without this, bumping the module to a new minor would leave CI building it with
          # the previous line.
          ci_go=$(grep -oE "go-version: '[0-9]+\.[0-9]+\.x'" .github/workflows/ci.yml \
            | head -1 | grep -oE '[0-9]+\.[0-9]+')
          mod_go=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)
          if [ -z "$ci_go" ] || [ -z "$mod_go" ]; then
            echo "::error::could not determine the Go version from both files"; exit 1
          fi
          if [ "$ci_go" != "$mod_go" ]; then
            echo "::error::CI builds with Go $ci_go but go.mod requires $mod_go"
            exit 1
          fi
          echo "CI Go $ci_go.x matches go.mod $mod_go"

      # Linters are installed before anything uses them. An earlier revision ran `golangci-lint
      # config verify` as its own step ahead of the action that installed the binary, which failed
      # with exit 127 on every run. Installing explicitly makes the ordering a property of the file
      # rather than of which step happens to come first, and drops a third-party action.
      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Verify lint configuration
        # A lint config that does not validate is worse than none: the run aborts, or silently
        # falls back to defaults. Verified before it is relied on.
        run: golangci-lint config verify

      - name: Check formatting
        # `golangci-lint fmt --diff` prints a diff and rewrites nothing, but it also exits non-zero
        # when it finds one, so the exit status is deliberately not the signal here: the output is.
        # The `|| true` is required because GitHub runs steps under `bash -e`, where a failing
        # command substitution in an assignment would abort the step before the diff could be
        # printed.
        #
        # Note that `golangci-lint run` does not enforce the formatters section, so this gate is
        # load-bearing and must not be dropped in favour of relying on the linter.
        run: |
          out="$(golangci-lint fmt --diff 2>&1 || true)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::formatting required; run 'golangci-lint fmt' and commit the result"
            exit 1
          fi
          echo "formatting clean"

      - name: Lint
        # Includes govet, errcheck, ineffassign, staticcheck and unused via default:standard, so
        # there is deliberately no separate `go vet` step.
        run: golangci-lint run ./...

      - name: Static analysis
        # golangci-lint's staticcheck is per-package. The standalone binary is whole-program and
        # additionally catches unused identifiers across package boundaries, which is how two
        # genuinely dead symbols were found in this repository.
        run: staticcheck ./cmd/... ./internal/... ./templ/... ./tests/...

      - name: Build
        # All three commands, not just the one the service runs. cmd/verse-export was built by
        # nothing here: the Verify job built only ./cmd/server, the Container job built cmd/migrate,
        # and a compile break in the export CLI would therefore have merged green and failed only
        # for an author who reached for it. It is the tool that holds the copy of the work this
        # project exists to preserve, so it was the worst candidate for the gap.
        run: |
          go build -tags netgo -ldflags="-s -w" -o verse ./cmd/server
          go build -tags netgo -ldflags="-s -w" -o migrate ./cmd/migrate
          go build -tags netgo -ldflags="-s -w" -o verse-export ./cmd/verse-export

      - name: Create the disposable test database
        # The truncating tests must target a database whose name marks it disposable, so they can
        # never share the one the application and the migration step use. One container, two
        # databases: `verse` keeps the production shape that DATABASE_URL and the Container job
        # expect, and `verse_test` is the only writable target.
        #
        # Idempotent, so running it against an existing container is harmless.
        run: |
          psql "postgres://verse:verse@localhost:5432/postgres" \
            -tAc "SELECT 1 FROM pg_database WHERE datname='verse_test'" | grep -q 1 \
            || psql "postgres://verse:verse@localhost:5432/postgres" -c 'CREATE DATABASE verse_test'
          psql "postgres://verse:verse@localhost:5432/verse_test" -tAc 'SELECT current_database()'

      - name: Run migrations
        run: go run ./cmd/migrate

      - name: Run tests
        # No -p 1. Each test package that touches the database has its own schema, so the packages
        # run concurrently without truncating one another. That flag was the only thing
        # preventing exactly that, and it was a constraint rather than a property: it had to be
        # remembered locally, could be forgotten without any test failing, and serialised
        # packages that do not touch the database at all.
        #
        # The isolation is verified rather than asserted. Pointing both packages at one schema and
        # running them concurrently 20 times produced 3 failures; with separate schemas the same
        # 20 rounds produced none. They are distinct relations, not the same table reached twice.
        #
        # Both destructive-test gates are set on purpose. Without them the database-backed tests
        # skip, and a skip is indistinguishable from a pass in the exit status, so the step below
        # asserts that nothing skipped.
        #
        # `set -o pipefail` is load-bearing: the runner's default shell does not enable it, so
        # piping into tee would otherwise discard go test's exit status and report a green job for
        # a failing suite.
        run: |
          set -o pipefail
          go test ./... -count=1 -race -v 2>&1 | tee /tmp/verse-tests.log
        env:
          VERSE_E2E_DATABASE_URL: postgres://verse:verse@localhost:5432/verse_test?sslmode=disable
          VERSE_E2E_ALLOW_DESTRUCTIVE: '1'

      - name: Assert the database-backed tests actually ran
        # A skipped test and a passed test both leave the exit status at zero. If the gate stopped
        # being satisfied -- a renamed variable, a typo in the consent value, a missing step --
        # this job would quietly shrink to a fraction of its coverage and still report green.
        #
          # The count is deliberately not asserted, which is a change from an earlier revision that
          # claimed 118 passing. A hard-coded count goes stale the moment a test is added, and this
          # one had been wrong since v0.3.8 -- eleven releases of reading as current precisely because
          # nobody re-ran it. That is the whole failure mode of a stale claim.
          #
          # What is asserted is the property a count cannot express: nothing skipped. A skip is the
          # dangerous outcome, because the database-backed tests sit behind two explicit opt-ins and a
          # mistyped variable turns every one of them into a skip while the exit status stays zero.
          # If a test ever needs a genuine skip, this assertion is what must change deliberately.
        run: |
          if grep -qE '^(---|[[:space:]]+---) SKIP' /tmp/verse-tests.log; then
            echo "::error::tests skipped, so the destructive-test gate is not satisfied in CI and coverage was silently reduced"
            grep -E '^(---|[[:space:]]+---) SKIP' /tmp/verse-tests.log
            exit 1
          fi
          echo "no skips; the database-backed tests executed"

      - name: Vulnerability scan
        # Pinned rather than @latest, so a new advisory database cannot change the result of a run
        # without a deliberate commit.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The serving credential holds no capability the application does not use.
  #
  # A separate job rather than a step in Verify because it needs a database in a different state from
  # the one the suite runs against, and because it is a claim about *privileges* that no Go test can
  # make: the tests all connect as the owner, and a Go test asserting its own rights is a test that
  # would pass identically under any role.
  #
  # The release plan made this the hard blocker for the whole author/viewer split -- "a read-only
  # publisher credential is impossible while the app mutates its own schema at boot" -- and it was
  # unmet for eleven releases because the belief was that dropping DDL required a pre-deploy hook,
  # which needs a paid compute plan. It does not. The migration runs at boot either way; giving it a
  # *different* connection is all that is required, and this job is what proves the result.
  least-privilege:
    name: Least privilege
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verse
          POSTGRES_PASSWORD: verse
          POSTGRES_DB: verse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U verse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Migrations run as the owner, which is what MIGRATION_DATABASE_URL will name. Applied here
      # rather than by the service below, so the privilege assertions test a schema that already
      # exists -- and so a failure to migrate is reported as a migration failure rather than as a
      # confusing permission error later.
      - name: Migrate as the owner
        env:
          DATABASE_URL: postgres://verse:verse@localhost:5432/verse?sslmode=disable
        run: go run ./cmd/migrate

      - name: Create the roles and grants
        # db/roles.sql, the file the operator is told to run. Not a copy of it.
        #
        # This step used to inline its own GRANT statements while the operator ran db/roles.sql, on the
        # reasoning that the script was a starting point rather than something to execute. The result is
        # the failure this release exists to prevent: db/roles.sql required a psql variable the
        # documented command did not pass, so it failed on its first statement, and CI stayed green
        # throughout because CI was never running it.
        #
        # db/roles.sql is not a migration and does not belong in migrations/ -- migrations are applied
        # at every boot by a service that must not hold CREATEROLE. It is a one-time operator step, and
        # this job is the one place it gets executed on every pull request.
        #
        # The password is a fixed constant rather than a secret. It exists only inside this job's
        # throwaway container, it authenticates a role holding less than the job's own service account,
        # and a random value would make the connection string in the next step unreadable in a failure
        # message.
        run: |
          psql "postgres://verse:verse@localhost:5432/verse" -v ON_ERROR_STOP=1 -v app_password=ci-throwaway-password -f db/roles.sql

      - name: Assert the serving credential's privileges
        # Fifteen properties, seven of which are the important ones: what the credential must not be
        # able to do. A check that only confirmed the happy path would pass against a role holding
        # every privilege in the database, so the denials are asserted too, and a denial that
        # succeeds fails the job.
        #
        # Inlined rather than kept in a script under ci/ for one reason: a directory holding a
        # single file that only this workflow runs is a directory someone has to discover. The
        # statements are the documentation, and the reason each denial matters is a comment.
        #
        # The `|| true` is load-bearing. Under `set -e` with `pipefail`, a statement that fails is
        # what most of these checks expect, and without it the shell aborts on the first deliberate
        # error -- before any assertion has run, reporting an exit that reads as a script bug rather
        # than as a passing denial. The status is inspected explicitly instead.
        run: |
          set -euo pipefail
          DSN="postgres://verse_app:ci-throwaway-password@localhost:5432/verse?sslmode=disable"

          as_app() { { PGOPTIONS='-c role=verse_app' psql "$DSN" -tAc "$1" 2>&1 || true; } | head -1; }

          allowed() {
            local out; out="$(as_app "$1")"
            if printf '%s' "$out" | grep -q 'ERROR:'; then
              echo "::error::the serving credential cannot $2, which it must be able to do: $out"
              echo "::error::a missing grant is a runtime failure during normal use, not at deploy time."
              exit 1
            fi
            echo "  ok  may $2"
          }

          denied() {
            local out; out="$(as_app "$1")"
            if ! printf '%s' "$out" | grep -q 'ERROR:'; then
              echo "::error::the serving credential CAN $2, which it must not be able to do."
              echo "::error::statement succeeded: $1"
              echo "::error::This is the property this job exists to hold. If the grant is genuinely"
              echo "::error::required, add it to db/roles.sql with a reason, and a test that needs it."
              exit 1
            fi
            echo "  ok  may not $2"
          }

          echo "the serving credential may do:"
          allowed "SELECT count(*) FROM poems"                            "read poems"
          allowed "INSERT INTO poems (id, content) VALUES (gen_random_uuid(), 'a work')" "insert a work"
          allowed "UPDATE poems SET content = 'edited' WHERE id = (SELECT id FROM poems LIMIT 1)" "edit a work"
          allowed "SELECT count(*) FROM poem_versions"                   "read retained revisions"
          # published_at arrived with 007. The SELECT grant is table-level, so it covers a column
          # added after the fact and no new grant was needed -- asserted rather than assumed, since
          # a column the serving role cannot read would break the authoring app.
          #
          # The writable half is deliberately NOT asserted here, and the reason is worth stating
          # because the natural thing to write is a `denied` line for it. The grant is table-level
          # UPDATE, which the application needs in order to edit content and to soft-delete, and a
          # table-level grant covers every column including one added later -- so the serving role
          # CAN write published_at. That was checked against a real database rather than assumed:
          # given one row, SET ROLE verse_app; UPDATE poems SET published_at = now() succeeded, and
          # the publisher's filter then returned that row.
          #
          # Nothing writes the column, so this is latent rather than live, and it is recorded as R24
          # in the project's risk register with two costed fixes. Asserting the denial would turn
          # this job permanently red, and a permanently red job is a job whose other fourteen
          # assertions stop being read.
          allowed "SELECT count(published_at) FROM poems"                "read the publication instant"
          # The one table the service deletes from, and correctly so: ratelimit.go clears a caller's
          # row on a successful login. It holds an HMAC of an address and counters, never work.
          allowed "INSERT INTO login_attempts (subject, failures, first_failure) VALUES ('\\x00'::bytea, 1, now())" "record a login attempt"
          allowed "DELETE FROM login_attempts"                           "clear a login attempt"
          allowed "SELECT to_regclass('poems')"                         "check the schema is there"

          echo "the serving credential may not:"
          # No CREATE/ALTER/DROP: the migration runs over the other credential.
          denied "CREATE TABLE verse_privilege_probe (id int)"          "create a table"
          denied "ALTER TABLE poems ADD COLUMN verse_privilege_probe int" "alter a table"
          denied "DROP TABLE poems"                                      "drop a table"
          # No DELETE or TRUNCATE on poems: every delete here is a soft delete written as an UPDATE
          # of deleted_at, so the one copy of the work that must never be lost cannot be destroyed
          # through the serving credential.
          denied "DELETE FROM poems"                                     "hard-delete a work"
          denied "TRUNCATE poems"                                       "truncate the library"
          # No UPDATE on poem_versions: a retained revision is immutable by design, and restoring
          # one is an ordinary edit that records the displaced text as a new version in turn.
          denied "UPDATE poem_versions SET content = 'rewritten' WHERE false" "edit a retained revision"
          # Deliberately not granted. The boot log reports which migrations ran; the serving process
          # cannot query the table that records it.
          denied "SELECT count(*) FROM schema_migrations"               "read the migration log"
          # NOT asserted: that the serving credential cannot publish.
          #
          # It can. The grant is table-level UPDATE, which the application needs in order to
          # edit content and to soft-delete, and a table-level grant covers every column
          # including one added later. The denial below was written here, failed against a
          # real database, and turned out to be asserting something false rather than
          # something unimplemented: given one row, the serving role published it and the
          # publisher's filter returned it.
          #
          # Whether publication should be structurally impossible for the serving role is
          # an open question, recorded in the split's risk register. It is a grant-model
          # change -- column-level grants, or a separate writer role behind a narrower API --
          # and not a CI assertion. This job records the grants that exist rather than the
          # grants someone would prefer, and an assertion that fails today would turn the
          # job permanently red, which is how a red job gets ignored.

      # The assertions above are static: they check the grants, not that the application works with
      # them. This boots the real service on the restricted credential and confirms it comes up
      # healthy, so a missing grant surfaces as a failed start rather than as a passing permission
      # check nobody exercised.
      #
      # The full suite is deliberately NOT run here. It truncates, and TRUNCATE is not in the grant
      # set -- granting it would make this job claim a least-privilege role it does not have. That
      # is why the old plan wording, "the suite passes on a SELECT-only role", was never a gate that
      # could be met honestly.
      - name: The service works on the restricted credential
        env:
          DATABASE_URL: postgres://verse_app:ci-throwaway-password@localhost:5432/verse?sslmode=disable
          MIGRATION_DATABASE_URL: postgres://verse:verse@localhost:5432/verse?sslmode=disable
          VERSE_AUTHORIZATION: a-ci-passphrase-long-enough
          VERSE_AUTH_SECRET: 0123456789abcdef0123456789abcdef
          PORT: '8080'
        run: |
          set -euo pipefail
          go run ./cmd/server > /tmp/verse-lp.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/health
          echo "the service started and reported healthy on the restricted credential"

          # The boot log must not report the fallback. If MIGRATION_DATABASE_URL were ignored the
          # service would still start here -- the schema already exists, so the migration is a no-op
          # that needs no rights -- which is exactly why this assertion exists.
          if grep -q 'MIGRATION_DATABASE_URL is not set' /tmp/verse-lp.log; then
            echo "::error::the service fell back to DATABASE_URL for the migration"
            cat /tmp/verse-lp.log
            exit 1
          fi
          echo "the migration used its own credential, not the serving one"

  container:
    name: Container
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verse
          POSTGRES_PASSWORD: verse
          POSTGRES_DB: verse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U verse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Floating patch, for the same reason as the verify job. See the note there.
          go-version: '1.26.x'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Verify Dockerfile Go version matches go.mod
        run: |
          # The Dockerfile previously pinned golang:1.25-alpine against `go 1.26.0` in go.mod and was
          # built by nothing, so the drift was invisible. Fail loudly instead.
          want=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)
          got=$(grep -oE '^FROM golang:[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          if [ -z "$got" ]; then
            echo "::error::no golang base image found in Dockerfile"; exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "::error::Dockerfile uses golang:$got but go.mod requires $want"
            exit 1
          fi
          echo "Dockerfile golang:$got matches go.mod $want"

      - name: Verify every Bun pin agrees
        run: |
          # Three build paths exist: the Dockerfile, this workflow, and Render. They all install Bun
          # and all produce the stylesheet, so they have to agree.
          #
          # render.yaml is the newest of the three and the one that had drifted furthest. Render's
          # default Bun depends on the service's creation date, so production was building the
          # stylesheet with 1.3.4 while CI and the Dockerfile used 1.3.5 and then 1.4.2. The two
          # repository paths were cross-checked against each other; Render was not checked against
          # anything, which is why nothing noticed.
          #
          # Every occurrence is compared, not just the first. An earlier version of this check piped
          # through `head -1`, so it compared the Dockerfile against only the first `bun-version`
          # line and would have reported success while a second one still disagreed.
          #
          # Go is deliberately absent. Render's native Go runtime always tracks the latest stable 1.x
          # and cannot be pinned without deploying a Docker image, so asserting it here would be a
          # check that cannot pass. RUNNING.md records the difference instead.
          docker_bun=$(grep -oE '^FROM oven/bun:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)
          if [ -z "$docker_bun" ]; then
            echo "::error::could not determine the Bun version from the Dockerfile"; exit 1
          fi

          mapfile -t ci_buns < <(grep -oE "bun-version: '[0-9.]+'" .github/workflows/ci.yml | grep -oE '[0-9.]+')
          if [ "${#ci_buns[@]}" -eq 0 ]; then
            echo "::error::could not determine the Bun version from the workflow"; exit 1
          fi

          render_bun=$(grep -A1 'key: BUN_VERSION' render.yaml | grep -oE "value: '[0-9.]+'" | grep -oE '[0-9.]+')
          if [ -z "$render_bun" ]; then
            echo "::error::render.yaml does not pin BUN_VERSION, so Render builds the stylesheet with whatever its default is"
            exit 1
          fi

          for ci_bun in "${ci_buns[@]}"; do
            if [ "$docker_bun" != "$ci_bun" ]; then
              echo "::error::Dockerfile uses oven/bun:$docker_bun but CI pins $ci_bun"
              exit 1
            fi
          done

          # Agreement with the Dockerfile is necessary but not sufficient: a pin the loops above did
          # not see could still disagree with the others. Compare the set, so "all pins are one
          # value" is asserted rather than assumed.
          all_pins=("${ci_buns[@]}" "$render_bun")
          distinct=$(printf '%s\n' "${all_pins[@]}" | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::the build paths disagree about the Bun version:"
            printf '  Dockerfile:  %s\n' "$docker_bun"
            printf '  CI:          %s\n' "${ci_buns[*]}"
            printf '  render.yaml: %s\n' "$render_bun"
            exit 1
          fi

          echo "all build paths agree on Bun $docker_bun (CI: ${#ci_buns[@]} pins, render.yaml: 1 pin)"

      - name: Build container image
        # The Dockerfile is a second, independently reproducible build path. It is only worth
        # keeping if it is actually built.
        run: docker build -t verse:ci .

      - name: The image migrates on boot, from a clean database
        # The production path. There is no pre-deploy hook on this service's Render plan, so the
        # service applies its own migrations at startup. This step exercises exactly that, against a
        # database the postgres service has just created and nothing has touched.
        #
        # This is the highest-value check in this job, because the version it replaces asserted the
        # opposite arrangement: that the image refuses to start until something else migrates first.
        # That arrangement is not available on this plan, so testing it would have been testing a
        # deployment model this service does not use.
        run: |
          set -uo pipefail

          cleanup() { docker rm -f verse-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          start() {
            docker rm -f verse-ci >/dev/null 2>&1 || true
            docker run -d --name verse-ci --network host \
              -e DATABASE_URL="$DATABASE_URL" \
              -e PORT=8080 \
              -e VERSE_AUTHORIZATION=ci-passphrase-for-smoke-tests \
              -e VERSE_AUTH_SECRET=ci-auth-secret-0123456789abcdef-0123 \
              verse:ci
          }

          wait_healthy() {
            for i in $(seq 1 45); do
              if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "container healthy after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "::error::container never became healthy"
            docker logs verse-ci || true
            return 1
          }

          # Matches the service's own log wording. Note there is no "verse:" prefix: the application
          # uses log.Printf, which does not add one, and only log.Fatalf does. A grep written against
          # the fatal path's prefix would match nothing and silently report zero applied every time.
          # "already applied" and "schema is up to date" do not contain this phrase, so a second boot
          # correctly counts zero.
          applied_count() {
            docker logs verse-ci 2>&1 | grep -c 'applied migration ' || true
          }

          # Container log capture is asynchronous, so a line the process has already written may not
          # be readable the instant the health check answers. Polling briefly removes a race that
          # otherwise fails a correct build at random. An earlier version of this step read the log
          # once and reported "the second boot did not report the schema as up to date" for a
          # container whose log plainly said so.
          wait_for_log() {
            for _ in $(seq 1 20); do
              if docker logs verse-ci 2>&1 | grep -q "$1"; then
                return 0
              fi
              sleep 0.5
            done
            return 1
          }

          # ---- first boot: nothing is migrated, so the service must do it itself ----
          start
          wait_healthy

          # Counted from the repository rather than written as a literal. An earlier version of this
          # check hardcoded 3 and every release that added a migration broke the Container job --
          # which is a poor reason to fail, and the kind of assertion that gets bumped until nobody
          # reads it again. Deriving the number also makes the check stronger: it now asserts the
          # service applied exactly the migration set that shipped, not a number someone remembered.
          expected=$(ls migrations/*.sql | wc -l)
          if [ "$expected" -eq 0 ]; then
            echo "::error::no migrations found in migrations/, the assertion below would be vacuous"
            exit 1
          fi

          if [ "$(applied_count)" -ne "$expected" ]; then
            echo "::error::expected the first boot to apply $expected migrations, got $(applied_count)"
            docker logs verse-ci || true
            exit 1
          fi

          # The schema must really be in the database, not merely reported as applied.
          for table in poems schema_migrations; do
            if [ "$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('$table') IS NOT NULL")" != "t" ]; then
              echo "::error::$table does not exist after the service migrated on boot"
              exit 1
            fi
          done

          cleanup

          # ---- second boot: already migrated, so the service must change nothing ----
          start
          wait_healthy

          if [ "$(applied_count)" -ne 0 ]; then
            echo "::error::the second boot applied $(applied_count) migrations, expected none"
            docker logs verse-ci || true
            exit 1
          fi
          if ! wait_for_log "schema is up to date"; then
            echo "::error::the second boot did not report the schema as up to date"
            docker logs verse-ci || true
            exit 1
          fi

          # And the bookkeeping is unchanged, which is the invariant that matters and does not depend
          # on log capture at all.
          recorded=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM schema_migrations")
          if [ "$recorded" -ne "$expected" ]; then
            echo "::error::schema_migrations holds $recorded rows after two boots, want $expected"
            exit 1
          fi

          # Still serving, which is the point of the whole exercise.
          curl -fsS -o /dev/null -w "GET /health -> %{http_code}\n" http://localhost:8080/health
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/library)
          if [ "$anon" != "303" ]; then
            echo "::error::anonymous /library returned $anon, want 303"
            exit 1
          fi
          echo "anonymous /library -> 303, as required"

          cleanup

      - name: The standalone migration binary works
        # Nothing in the deploy path invokes /app/migrate any more, since the service migrates at
        # startup. It still ships, because it is the operator's way to apply a migration by hand
        # without deploying:
        #
        #   docker run --rm --entrypoint /app/migrate verse:ci
        #
        # A binary that nothing exercises is a binary that is quietly broken. This keeps it honest,
        # and it is also the mechanism the documented upgrade path to a pre-deploy command would use.
        run: |
          set -uo pipefail

          # Start from an empty database rather than inheriting whatever the boot-migration step left
          # behind, so this step verifies that the binary actually migrates and is not merely
          # reporting a database someone else already prepared.
          psql "$DATABASE_URL" -qc 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

          if ! docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            --entrypoint /app/migrate verse:ci; then
            echo "::error::the standalone migration binary failed on an empty database"
            exit 1
          fi

          for table in poems schema_migrations; do
            if [ "$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('$table') IS NOT NULL")" != "t" ]; then
              echo "::error::$table does not exist after the standalone binary ran"
              exit 1
            fi
          done

          second=$(docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            --entrypoint /app/migrate verse:ci 2>&1)
          echo "$second"
          if ! echo "$second" | grep -q "schema is up to date"; then
            echo "::error::the standalone migration binary is not idempotent"
            exit 1
          fi

      - name: Smoke test the image
        # --network host puts the container in the runner's network namespace, which is what makes
        # this work: a plain `docker run` joins the default bridge and can neither reach the job's
        # postgres service by name nor be reached by `curl localhost:8080`. An earlier revision had
        # no DATABASE_URL and no published port, so the container exited during boot and this step
        # could never have passed.
        run: |
          set -uo pipefail

          docker run -d --name verse-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=8080 \
            -e VERSE_AUTHORIZATION=ci-passphrase-for-smoke-tests \
            -e VERSE_AUTH_SECRET=ci-auth-secret-0123456789abcdef-0123 \
            verse:ci

          cleanup() { docker rm -f verse-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "container healthy after ${i}s"
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' verse-ci 2>/dev/null | grep -q true; then
              echo "::error::container exited before becoming healthy"
              docker logs verse-ci || true
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
            echo "::error::container did not become healthy within 45s"
            docker logs verse-ci || true
            exit 1
          fi

          # The authoring surface must not be reachable without a session.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/library)
          if [ "$code" != "303" ] && [ "$code" != "401" ]; then
            echo "::error::/library returned $code for an unauthenticated request; expected 303 or 401"
            docker logs verse-ci || true
            exit 1
          fi
            echo "unauthenticated /library correctly rejected with $code"

            # The image must serve a page, not merely start.
            #
            # Everything above is invisible to a missing asset. /health answers from the process, and
            # /library is refused by the router before any handler runs, so an image with no
            # JavaScript and no Tailwind utilities passed every one of them for as long as the two
            # build paths disagreed. These four assertions are the difference: the image is asked for
            # the files a browser requests, and the stylesheet is inspected for a class that can only
            # be present if the templates were scanned when it was built.
            for asset in /static/js/htmx.min.js /static/js/navigation.js /static/css/output.css; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${asset}")
              if [ "$code" != "200" ]; then
                echo "::error::${asset} returned ${code} from the image; expected 200"
                docker logs verse-ci || true
                exit 1
              fi
            done
            echo "image serves its JavaScript and stylesheet"

            # A stylesheet carrying only theme variables and preflight returns 200 here, so the
            # request above is not enough on its own. min-h-0 and overflow-hidden are both load-bearing
            # in the editor and dashboard layouts, so a build that dropped them would still look
            # correct to every other check in this job.
            if ! curl -fsS http://localhost:8080/static/css/output.css | grep -q '\.min-h-0'; then
              echo "::error::the image's stylesheet contains no utility classes; Tailwind found no source files, which is what a css stage without templ/ and internal/ produces"
              exit 1
            fi
            echo "image stylesheet contains generated utility classes"


          # The application must refuse to start without its authentication configuration.
          echo "--- verifying fail-closed startup ---"
          if docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=8081 \
            verse:ci >/tmp/verse-noauth.log 2>&1; then
            echo "::error::the image started without VERSE_AUTHORIZATION and VERSE_AUTH_SECRET"
            exit 1
          fi
          grep -q "refusing to start: authentication is not configured" /tmp/verse-noauth.log \
            || { echo "::error::expected a fail-closed startup message"; cat /tmp/verse-noauth.log; exit 1; }
          echo "image refuses to start without authentication configuration"
